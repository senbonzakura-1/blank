name: GCP WIF Probe
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GCP WIF Exchange Test
        run: |
          set +e
          # Get OIDC token with GCP WIF audience
          GCP_TOKEN=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/projects/441280564867/locations/global/workloadIdentityPools/github/providers/github-oidc" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])" 2>&1)
          echo "TOKEN_STATUS=$?"
          echo "TOKEN_PREVIEW=${GCP_TOKEN:0:50}"
          
          # Attempt STS token exchange
          STS_RESULT=$(curl -s -X POST "https://sts.googleapis.com/v1/token" \
            -H "Content-Type: application/json" \
            -d "{\"audience\":\"//iam.googleapis.com/projects/441280564867/locations/global/workloadIdentityPools/github/providers/github-oidc\",\"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",\"subjectToken\":\"$GCP_TOKEN\",\"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\"}")
          echo "STS_RESULT=${STS_RESULT}"
          
          # If access token obtained, check what SA we are
          ACCESS_TOKEN=$(echo "$STS_RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','NONE'))" 2>/dev/null)
          if [ "$ACCESS_TOKEN" != "NONE" ] && [ -n "$ACCESS_TOKEN" ]; then
            echo "ACCESS_TOKEN_OBTAINED=YES"
            TOKEN_INFO=$(curl -s "https://www.googleapis.com/oauth2/v1/tokeninfo?access_token=$ACCESS_TOKEN")
            echo "TOKEN_INFO=$TOKEN_INFO"
            # Try to list GKE clusters
            CLUSTERS=$(curl -s "https://container.googleapis.com/v1/projects/441280564867/zones/-/clusters" \
              -H "Authorization: Bearer $ACCESS_TOKEN")
            echo "CLUSTERS=$CLUSTERS"
          else
            echo "ACCESS_TOKEN_OBTAINED=NO"
            echo "STS_ERROR=$(echo $STS_RESULT | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"error\",\"\"),d.get(\"error_description\",\"\"))' 2>/dev/null)"
          fi
