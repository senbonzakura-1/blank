name: STS Oracle v4
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: STS Probe v4
        run: |
          # Get token and write to file (avoids masking issue)
          curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])" > /tmp/oidc_token.txt
          echo "TOKEN_LEN=$(wc -c < /tmp/oidc_token.txt)"
          export OIDC_TOKEN=$(cat /tmp/oidc_token.txt)
            python3 -c "import subprocess,os; token=os.environ.get(\"OIDC_TOKEN\",\"\"); r=subprocess.run([\"aws\",\"sts\",\"assume-role-with-web-identity\",\"--role-arn\",\"arn:aws:iam::062341577280:role/github-actions-role\",\"--role-session-name\",\"t\",\"--web-identity-token\",token,\"--region\",\"us-east-1\"],capture_output=True,text=True); e=r.stdout+r.stderr; result=\"HAS_OIDC\" if \"AccessDenied\" in e else (\"NO_OIDC\" if \"OpenIDConnect\" in e else e[:80]); print(\"062341577280=\" + result)" || true
            python3 -c "import subprocess,os; token=os.environ.get(\"OIDC_TOKEN\",\"\"); r=subprocess.run([\"aws\",\"sts\",\"assume-role-with-web-identity\",\"--role-arn\",\"arn:aws:iam::940202570803:role/github-actions-role\",\"--role-session-name\",\"t\",\"--web-identity-token\",token,\"--region\",\"us-east-1\"],capture_output=True,text=True); e=r.stdout+r.stderr; result=\"HAS_OIDC\" if \"AccessDenied\" in e else (\"NO_OIDC\" if \"OpenIDConnect\" in e else e[:80]); print(\"940202570803=\" + result)" || true
